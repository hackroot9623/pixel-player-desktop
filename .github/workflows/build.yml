name: Build bundles

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish/update the release

env:
  FLUTTER_VERSION: 3.44.4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: pixelplayer-linux-x64.tar.gz
          - os: windows-latest
            platform: windows
            artifact: pixelplayer-windows-x64.zip
          # macos-latest is Apple silicon, so this bundle is arm64.
          - os: macos-latest
            platform: macos
            artifact: pixelplayer-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # libmpv is what media_kit plays through, and sqlite3 backs the library.
      # The GTK and appindicator packages are Flutter's own Linux requirements.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake clang pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev \
            libmpv-dev mpv libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # --no-fatal-infos, because the tree carries a handful of deliberate
      # infos: deprecated Radio/ReorderableList APIs kept until their
      # replacements land, and one implementation_import the tag writer needs.
      # Errors and warnings still fail the build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Two tests want a real music file and are skipped without MUSIC_DIR.
      - name: Test
        run: flutter test

      - name: Build release bundle
        run: flutter build ${{ matrix.platform }} --release

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist/pixelplayer
          cp -r build/linux/x64/release/bundle/. dist/pixelplayer/
          cp packaging/com.theveloper.pixelplay_desktop.desktop \
             packaging/com.theveloper.pixelplay_desktop.png \
             packaging/install.sh packaging/uninstall.sh \
             dist/pixelplayer/
          tar -C dist -czf ${{ matrix.artifact }} pixelplayer

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ${{ matrix.artifact }}

      # ditto rather than zip: it preserves the bundle's symlinks and resource
      # forks, without which the .app will not launch.
      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd build/macos/Build/Products/Release
          APP="$(ls -d *.app | head -n1)"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: >-
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Pushes to the default branch keep a rolling "latest" prerelease, so
      # there is always a current build to download without cutting a version.
      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          body: |
            Automatically built from the latest commit (${{ github.sha }}).

            **Linux** — extract and run `./install.sh` (installs into `~/.local`,
            no root). Needs libmpv: `mpv` or `libmpv2` from your package manager.
            **Windows** — extract and run `pixelplay_desktop.exe`.
            **macOS** — unzip and move the app to Applications. It is unsigned,
            so the first launch needs right-click → Open.
          files: dist/*

      # v* tags cut a proper versioned release.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
